<template>
<style>#root{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}</style>
<div id="root" data-composition-id="enter" data-width="1080" data-height="1920"><canvas id="enter-paint" width="1080" height="1920" aria-label="enter scene"></canvas></div>
<script>
window.HawkinsPaint.ready.then(() => {
 const canvas = document.getElementById('enter-paint');
 const c = canvas.getContext('2d',{willReadFrequently:true});
 const clock = {t:0};
 const tl = gsap.timeline({paused:true});
 tl.fromTo(clock,{t:0},{t:3,duration:3,ease:'none',onUpdate:()=>window.HawkinsPaint.draw(c,'enter',clock.t)},0);
 window.HawkinsPaint.draw(c,'enter',0);
 window.__timelines['enter'] = tl;
});
</script>
</template>
